<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>กิจกรรมภารกิจล่าสมบัติ - Math Camp 11th</title>
    
    <!-- ฟอนต์ Kanit -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK (ใช้เวอร์ชัน Compat เพื่อให้ทำงานในไฟล์เดียวได้ง่าย) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-dark: #1a120b;
            --panel-bg: rgba(30, 20, 15, 0.9);
            --gold-text: #f4d03f;
            --border-wood: #8b5a2b;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--bg-dark);
            /* พื้นหลังลายกระดาษเก่า ธีมโจรสลัด */
            background-image: url('https://www.transparenttextures.com/patterns/aged-paper.png');
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ส่วนหัว (Header) */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to right, #2c1a0c, #4a2e15, #2c1a0c);
            padding: 15px 20px;
            border-bottom: 4px solid var(--border-wood);
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
        }
        header h1 {
            margin: 0;
            font-size: 1.4rem;
            color: var(--gold-text);
            text-shadow: 2px 2px 4px #000;
        }
        header h2 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 400;
            color: #fff;
            text-shadow: 1px 1px 3px #000;
        }

        /* เมนูนำทาง (Navigation) */
        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.5);
        }
        button.nav-btn {
            background: #5c3a21;
            color: white;
            border: 2px solid #a67c52;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Kanit', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        }
        button.nav-btn:hover {
            background: #754b2d;
        }
        button.nav-btn.active {
            background: var(--gold-text);
            color: #000;
            border-color: #fff;
            font-weight: 600;
        }
        button.nav-btn.reset-btn {
            background: #8b0000;
            border-color: #ff4c4c;
        }

        /* พื้นที่เนื้อหา (Main Container) */
        .container {
            flex: 1;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .section { display: none; animation: fadeIn 0.4s; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* การ์ดเนื้อหา (Card) */
        .card {
            background: var(--panel-bg);
            border: 2px solid var(--border-wood);
            border-radius: 12px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }
        h2.title {
            color: var(--gold-text);
            margin-top: 0;
            border-bottom: 2px dashed var(--border-wood);
            padding-bottom: 10px;
        }

        /* กล่องเลือกกลุ่มและพิมพ์รหัส */
        select, input[type="text"] {
            font-family: 'Kanit', sans-serif;
            font-size: 1.4rem;
            padding: 12px;
            margin: 15px 0;
            border-radius: 8px;
            border: 2px solid var(--border-wood);
            background: #111;
            color: var(--gold-text);
            width: 100%;
            max-width: 350px;
            text-align: center;
            box-sizing: border-box;
        }
        input:disabled { opacity: 0.5; background: #333; }

        /* แป้นพิมพ์ตัวเลข (Numpad) */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 320px;
            margin: 20px auto 0;
        }
        .key-btn {
            background: #3e2723;
            color: white;
            border: 2px solid #5d4037;
            padding: 15px;
            font-size: 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0 #1b1005;
            transition: 0.1s;
        }
        .key-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #1b1005;
        }
        .key-btn.action-c { background: #b71c1c; border-color: #d32f2f; }
        .key-btn.action-go { background: #1b5e20; border-color: #2e7d32; font-weight: bold; }

        /* ข้อความแจ้งเตือน Lockout */
        .lock-msg {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff4c4c;
            color: #ff6b6b;
            padding: 10px;
            border-radius: 8px;
            font-size: 1.2rem;
            margin: 10px auto;
            display: none;
            max-width: 350px;
        }

        /* ตารางคะแนน (Leaderboard) */
        .progress-container { margin-top: 20px; }
        .group-row {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            background: rgba(0,0,0,0.6);
            padding: 10px 15px;
            border-radius: 8px;
            border-left: 6px solid transparent; /* แสดงสีของกลุ่ม */
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .group-name { 
            width: 80px; 
            font-weight: 600; 
            font-size: 1.1rem;
            text-shadow: 1px 1px 2px #000;
        }
        .progress-bar-bg {
            flex: 1;
            height: 22px;
            background: #222;
            border-radius: 12px;
            margin: 0 15px;
            overflow: hidden;
            border: 1px solid #444;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            transition: width 0.5s ease-in-out;
            background-image: linear-gradient(45deg, rgba(255,255,255,0.15) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0.15) 75%, transparent 75%, transparent);
            background-size: 1rem 1rem;
        }
        .group-level { 
            width: 60px; 
            text-align: right; 
            font-weight: bold;
            color: var(--gold-text);
        }

        /* Custom Modal (สำหรับการกดรีเซ็ต) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none; justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: #2c1a0c;
            border: 3px solid var(--border-wood);
            padding: 30px; 
            border-radius: 12px; 
            text-align: center;
            max-width: 90%;
        }
        .modal-box h3 { color: #ff4c4c; margin-top: 0; }
        .modal-box button { margin: 10px; font-size: 1.1rem; padding: 10px 20px; }
        
        /* Toast Notification */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 15px;
            position: fixed;
            z-index: 1001;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2rem;
            border: 2px solid var(--gold-text);
        }
        #toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }
        @keyframes fadeout { from {opacity: 1;} to {opacity: 0;} }
    </style>
</head>
<body>

    <header>
        <h1>กิจกรรมภารกิจล่าสมบัติ</h1>
        <h2>Math Camp 11th</h2>
    </header>

    <nav>
        <button class="nav-btn active" onclick="switchTab('input')">หน้าพิมพ์รหัส</button>
        <button class="nav-btn" onclick="switchTab('leaderboard')">ตารางคะแนน</button>
        <button class="nav-btn reset-btn" onclick="showResetModal()">เริ่มใหม่ (Reset)</button>
    </nav>

    <div class="container">
        <!-- 1. หน้าพิมพ์รหัส -->
        <div id="input-section" class="section active card">
            <h2 class="title">ป้อนรหัสปลดล็อค</h2>
            
            <select id="group-select" onchange="updateUI()">
                <!-- ตัวเลือกกลุ่มจะถูกสร้างด้วย JavaScript -->
            </select>
            
            <h3 id="current-level-display" style="color: #fff; margin: 10px 0;">ด่านปัจจุบัน: 1 / 10</h3>
            
            <!-- แจ้งเตือนเวลาโดนบล็อค -->
            <div id="lock-message" class="lock-msg">
                ถูกระงับการตอบ!<br>รอ <span id="countdown">0</span> วินาที
            </div>

            <input type="text" id="password-input" placeholder="พิมพ์หรือกดตัวเลข..." autocomplete="off">
            
            <!-- แป้นพิมพ์บนหน้าจอ -->
            <div class="keypad">
                <button class="key-btn" onclick="typeNumber('1')">1</button>
                <button class="key-btn" onclick="typeNumber('2')">2</button>
                <button class="key-btn" onclick="typeNumber('3')">3</button>
                <button class="key-btn" onclick="typeNumber('4')">4</button>
                <button class="key-btn" onclick="typeNumber('5')">5</button>
                <button class="key-btn" onclick="typeNumber('6')">6</button>
                <button class="key-btn" onclick="typeNumber('7')">7</button>
                <button class="key-btn" onclick="typeNumber('8')">8</button>
                <button class="key-btn" onclick="typeNumber('9')">9</button>
                <button class="key-btn action-c" onclick="clearInput()">C</button>
                <button class="key-btn" onclick="typeNumber('0')">0</button>
                <button class="key-btn action-go" onclick="submitPassword()">GO</button>
            </div>
        </div>

        <!-- 2. หน้าตารางคะแนน -->
        <div id="leaderboard-section" class="section card">
            <h2 class="title">ตารางการแข่งขัน</h2>
            <div id="leaderboard-container" class="progress-container">
                <!-- ตารางจะถูกสร้างด้วย JavaScript -->
            </div>
        </div>
    </div>

    <!-- แจ้งเตือน Pop-up (Toast) -->
    <div id="toast">ข้อความแจ้งเตือน</div>

    <!-- กล่องยืนยันการ Reset -->
    <div id="reset-modal" class="modal-overlay">
        <div class="modal-box">
            <h3>ยืนยันการเริ่มใหม่ทั้งหมด?</h3>
            <p style="color: #ddd;">ข้อมูลด่านและการถูกระงับของทุกกลุ่มจะถูกลบ<br>และกลับไปเริ่มที่ด่าน 1 ใหม่ทั้งหมด</p>
            <button class="nav-btn reset-btn" onclick="resetGame()">ยืนยัน</button>
            <button class="nav-btn" onclick="closeResetModal()">ยกเลิก</button>
        </div>
    </div>

    <script>
        // ========================================================
        // ตั้งค่าส่วนนี้ก่อนอัปโหลดขึ้น GitHub 
        // นำข้อมูลจาก Firebase > Project Settings > พิมพ์แทนที่ค่าด้านล่าง
        // ========================================================
       const firebaseConfig = {
            apiKey: "AIzaSyBemPXK8c0cWEeKfbi2W1trSUdaHacnNpI",
            authDomain: "math-camp-11.firebaseapp.com",
            databaseURL: "https://math-camp-11-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "math-camp-11",
            storageBucket: "math-camp-11.firebasestorage.app",
            messagingSenderId: "346657266597",
            appId: "1:346657266597:web:9f5b404b81276ba850e64c",
            measurementId: "G-HC0PDZZ5EE"
        };
        
        // ========================================================
        // ตั้งค่ารหัสผ่านทั้ง 10 ด่าน (แก้ตัวเลขในเครื่องหมายคำพูดได้เลย)
        // ========================================================
        const passwords = ["9000", "3035", "4320", "4755", "1897", "2345", "42138", "", "820591", "83724651109"];
        const totalLevels = passwords.length;

        // ========================================================
        // ตั้งค่ากลุ่มและสีตามที่คุณกำหนด
        // ========================================================
        const groupConfigs = [
            { id: 1, name: "กลุ่ม 1", color: "#FF0000", colorName: "แดง" },
            { id: 2, name: "กลุ่ม 2", color: "#FFD700", colorName: "เหลือง" },
            { id: 3, name: "กลุ่ม 3", color: "#FF00FF", colorName: "บานเย็น" },
            { id: 4, name: "กลุ่ม 4", color: "#00FF00", colorName: "เขียว" },
            { id: 5, name: "กลุ่ม 5", color: "#FF8C00", colorName: "แสด" },
            { id: 6, name: "กลุ่ม 6", color: "#00BFFF", colorName: "ฟ้า" },
            { id: 7, name: "กลุ่ม 7", color: "#800080", colorName: "ม่วง" },
            { id: 8, name: "กลุ่ม 8", color: "#A9A9A9", colorName: "เทา" },
            { id: 9, name: "กลุ่ม 9", color: "#0000FF", colorName: "น้ำเงิน" },
            { id: 10, name: "กลุ่ม 10", color: "#8B4513", colorName: "น้ำตาล" }
        ];

        // --------------------------------------------------------
        // โค้ดระบบเบื้องหลัง (ไม่ต้องแก้ไขหากไม่ต้องการเปลี่ยนกติกา)
        // --------------------------------------------------------
        let localState = {};
        let db;

        function initApp() {
            // เช็คว่าผู้ใช้ลืมใส่ API Key หรือไม่
            if (firebaseConfig.apiKey.includes("ใส่_API_KEY")) {
                showToast("⚠️ แจ้งเตือน: ยังไม่ได้ใส่ตั้งค่า Firebase ระบบจะไม่บันทึกผลข้ามเครื่อง");
            }

            try {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();

                // สร้าง Dropdown ให้ครบ 10 กลุ่ม
                const select = document.getElementById('group-select');
                groupConfigs.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g.id;
                    opt.textContent = `${g.name} (${g.colorName})`;
                    select.appendChild(opt);
                });

                // ดึงข้อมูลตลอดเวลาจาก Firebase
                db.ref('groups').on('value', snapshot => {
                    localState = snapshot.val() || {};
                    updateUI();
                    renderLeaderboard();
                });

                // ตรวจสอบเวลานับถอยหลังทุกๆ 1 วินาที
                setInterval(updateUI, 1000);
            } catch (error) {
                console.error("Firebase Error:", error);
            }
        }

        // การสลับหน้าจอ (Tab)
        function switchTab(tab) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav .nav-btn').forEach(el => el.classList.remove('active'));
            
            if (tab === 'input') {
                document.getElementById('input-section').classList.add('active');
                document.querySelectorAll('nav .nav-btn')[0].classList.add('active');
            } else {
                document.getElementById('leaderboard-section').classList.add('active');
                document.querySelectorAll('nav .nav-btn')[1].classList.add('active');
                renderLeaderboard();
            }
        }

        // ฟังก์ชันแป้นพิมพ์บนจอ
        const pwInput = document.getElementById('password-input');
        function typeNumber(num) {
            if(!pwInput.disabled) pwInput.value += num;
        }
        function clearInput() { pwInput.value = ''; }
        
        // รองรับกด Enter จากคีย์บอร์ดคอมพิวเตอร์
        pwInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') submitPassword();
        });

        // อัปเดตหน้าจอหลัก (นับถอยหลัง Lock / ด่านปัจจุบัน)
        function updateUI() {
            const groupId = document.getElementById('group-select').value;
            if(!groupId) return;
            
            const groupData = localState[groupId] || { level: 0, wrongCount: 0, lockUntil: 0 };
            const currentLevel = Math.min(groupData.level + 1, totalLevels);
            const levelText = groupData.level >= totalLevels ? "🎉 ภารกิจสมบูรณ์!" : `ด่านปัจจุบัน: ${currentLevel} / ${totalLevels}`;
            document.getElementById('current-level-display').innerText = levelText;

            const now = Date.now();
            const lockMsg = document.getElementById('lock-message');
            const countdownSpan = document.getElementById('countdown');
            
            // เช็คว่าโดนแบนอยู่หรือไม่
            if (groupData.lockUntil > now) {
                const remaining = Math.ceil((groupData.lockUntil - now) / 1000);
                countdownSpan.innerText = remaining;
                lockMsg.style.display = 'block';
                pwInput.disabled = true;
            } else {
                lockMsg.style.display = 'none';
                pwInput.disabled = (groupData.level >= totalLevels);
            }
        }

        // ส่งรหัสผ่านตรวจ
        function submitPassword() {
            const groupId = document.getElementById('group-select').value;
            const groupData = localState[groupId] || { level: 0, wrongCount: 0, lockUntil: 0, lastPassedTime: 0 };
            
            if (groupData.lockUntil > Date.now()) {
                showToast("⏳ กรุณารอให้หมดเวลาแบนก่อน");
                return;
            }
            if (groupData.level >= totalLevels) {
                showToast("🏆 กลุ่มนี้เคลียร์ครบทุกด่านแล้ว!");
                return;
            }

            const currentLevelIndex = groupData.level; // Array เริ่มที่ 0
            const correctAnswer = passwords[currentLevelIndex];
            const userAnswer = pwInput.value.trim();

            if (userAnswer === '') return;

            if (userAnswer === correctAnswer) {
                // ตอบถูก
                db.ref('groups/' + groupId).set({
                    level: groupData.level + 1,
                    wrongCount: 0,
                    lockUntil: 0,
                    lastPassedTime: Date.now() // เก็บเวลาเพื่อใช้จัดอันดับกรณีด่านเท่ากัน
                });
                showToast("✅ ถูกต้อง! ผ่านด่านแล้ว");
                clearInput();
            } else {
                // ตอบผิด
                let newWrongCount = groupData.wrongCount + 1;
                let newLockUntil = 0;
                
                // กติกาพิเศษด่านที่ 8 (index 7): ผิด 1 ครั้ง โดนแบน 1 นาทีทันที
                // กติกาปกติ: ผิดครบ 3 ครั้ง โดนแบน 1 นาที
                if (currentLevelIndex === 7 || newWrongCount >= 3) {
                    newLockUntil = Date.now() + 60000; // ล็อค 60 วินาที
                    newWrongCount = 0;
                    showToast("❌ รหัสผิด! ถูกระงับการตอบ 1 นาที");
                } else {
                    showToast(`❌ รหัสผิด! (ผิดไปแล้ว ${newWrongCount}/3 ครั้ง)`);
                }
                
                db.ref('groups/' + groupId).update({
                    wrongCount: newWrongCount,
                    lockUntil: newLockUntil
                });
                clearInput();
            }
        }

        // จัดอันดับกระดานคะแนน
        function renderLeaderboard() {
            const container = document.getElementById('leaderboard-container');
            container.innerHTML = '';

            // นำข้อมูลของกลุ่มมารวมกับสถานะล่าสุด
            let sortedGroups = groupConfigs.map(g => {
                const data = localState[g.id] || { level: 0, lastPassedTime: 0 };
                return { ...g, ...data };
            });

            // การเรียงลำดับ (Sort)
            sortedGroups.sort((a, b) => {
                // 1. เรียงตามด่านที่ผ่าน (มากไปน้อย)
                if (b.level !== a.level) {
                    return b.level - a.level;
                }
                // 2. ถ้าด่านเท่ากัน เรียงตามเวลา (ใครผ่านก่อน เวลาน้อยกว่า ขึ้นก่อน)
                const timeA = a.lastPassedTime === 0 ? Infinity : a.lastPassedTime;
                const timeB = b.lastPassedTime === 0 ? Infinity : b.lastPassedTime;
                return timeA - timeB;
            });

            // สร้างกราฟแท่ง
            sortedGroups.forEach(g => {
                const percentage = (g.level / totalLevels) * 100;
                
                const row = document.createElement('div');
                row.className = 'group-row';
                row.style.borderLeftColor = g.color;

                row.innerHTML = `
                    <div class="group-name" style="color: ${g.color}">${g.name}</div>
                    <div class="progress-bar-bg">
                        <div class="progress-fill" style="width: ${percentage}%; background-color: ${g.color};"></div>
                    </div>
                    <div class="group-level">${g.level}/${totalLevels}</div>
                `;
                container.appendChild(row);
            });
        }

        // แจ้งเตือนข้อความ Pop-up
        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        // ควบคุม Modal Reset
        function showResetModal() { document.getElementById('reset-modal').style.display = 'flex'; }
        function closeResetModal() { document.getElementById('reset-modal').style.display = 'none'; }

        function resetGame() {
            let initialState = {};
            groupConfigs.forEach(g => {
                initialState[g.id] = { level: 0, wrongCount: 0, lockUntil: 0, lastPassedTime: 0 };
            });
            
            db.ref('groups').set(initialState)
                .then(() => {
                    closeResetModal();
                    showToast("🔄 ระบบถูกรีเซ็ต เริ่มเกมใหม่ได้!");
                })
                .catch(err => {
                    showToast("⚠️ เกิดข้อผิดพลาดในการรีเซ็ต");
                    closeResetModal();
                });
        }

        window.onload = initApp;
    </script>
</body>
</html>
